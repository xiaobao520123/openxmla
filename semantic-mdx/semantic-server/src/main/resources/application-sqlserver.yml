spring:
  datasource:
    druid:
      url: jdbc:sqlserver://${insight.database.ip}:${insight.database.port};databaseName=${insight.database.name};encrypt=${insight.database.useSSL};trustServerCertificate=true;useUnicode=true;characterEncoding=UTF8;autoReconnect=true
      username: ${insight.database.username}
      password: ${insight.database.password}
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
      initial-size: 2
      max-active: 20
      min-idle: 5
      max-wait: 60000
      test-on-borrow: false
      test-on-return: false
      test-while-idle: true
      validation-query: select 1
      validationQueryTimeout: 2
      time-between-eviction-runs-millis: 60000
      filter:
        slf4j:
          enabled: false
        wall:
          enabled: true
        stat:
          slow-sql-millis: 1000
          log-slow-sql: true
          enabled: true
      web-stat-filter:
        enabled: false
      stat-view-servlet:
        enabled: false
      pool-prepared-statements: false
      max-pool-prepared-statement-per-connection-size: 20
      min-evictable-idle-time-millis: 30000
      connection-init-sqls: 'SET NOCOUNT ON;'
      #连接池中的minIdle数量以内的连接，空闲时间超过minEvictableIdleTimeMillis，则会执行keepAlive操作。
      keep-alive: false
      #定期把监控数据输出到日志，或者通过-Ddruid.timeBetweenLogStatsMillis=300000启用
      time-between-log-stats-millis: -1
      #连接泄漏检测。RemoveAbandoned相关配置，用来关闭长时间不使用的连接
      remove-abandoned: false
    schema:
      - classpath:kylin_semantic_sqlserver_full.sql
    initialization-mode: never

mybatis:
  mapper-locations: classpath:io/kylin/mdx/insight/core/dao/xml/*.xml
  configuration:
    database-id: sqlserver

pagehelper:
  reasonable: false
  page-size-zero: false
  offset-as-page-num: true
  helper-dialect: sqlserver
  row-bounds-with-count: true

mapper:
  not-empty: false
  identity: SQLSERVER